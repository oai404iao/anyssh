[workspace]
members = [
  "apps/client/src-tauri",
  "crates/anyssh-domain",
  "crates/anyssh-ssh",
]
default-members = [
  "crates/anyssh-domain",
  "crates/anyssh-ssh",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyssh-domain = { path = "crates/anyssh-domain" }
anyssh-ssh = { path = "crates/anyssh-ssh" }
bytes = "1.10"
russh = "0.62.4"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
zeroize = "1.8"
