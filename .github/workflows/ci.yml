name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:frontend
      - run: pnpm typecheck
      - run: pnpm test:frontend
      - run: pnpm build
      - run: pnpm docs:check

  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude anyssh-client --all-targets -- -D warnings
      - run: cargo test --workspace --exclude anyssh-client

  native-linux-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libxtst-dev \
            librsvg2-dev \
            dbus-x11 \
            ibus \
            ibus-libpinyin \
            openssh-client \
            wayland-utils \
            weston \
            xvfb \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo check --package anyssh-client
      - run: pnpm qa:native:xvfb
      - run: pnpm qa:native:wayland
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-evidence
          path: |
            artifacts/native-xvfb/
            artifacts/native-wayland/

  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: bash scripts/build-in-container.sh android
        env:
          ANYSSH_USE_BUILDX: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-arm64-build
          path: artifacts/android-build/

  linux-container-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: bash scripts/build-in-container.sh linux
        env:
          ANYSSH_USE_BUILDX: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-container-build
          path: artifacts/linux-build/

  windows-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anyssh/client tauri build --debug --no-bundle --ci
      - uses: actions/upload-artifact@v4
        with:
          name: windows-debug-build
          path: target/debug/anyssh-client.exe

  openssh-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
      - run: pnpm test:ssh:smoke

  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anyssh/client exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/client/playwright-report/

  agent-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global agent-browser@0.27.0
      - run: agent-browser install --with-deps
      - run: pnpm qa:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-browser-evidence
          path: artifacts/agent-browser/
